<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      .fade { opacity: 0; animation: fadeIn 0.8s ease forwards; }
      .slide { opacity: 0; animation: slideUp 0.6s ease forwards; }
      .pulse { animation: pulse 3s ease-in-out infinite; }

      .f1 { animation-delay: 0.2s; }
      .f2 { animation-delay: 0.6s; }
      .f3 { animation-delay: 1.0s; }
      .f4 { animation-delay: 1.4s; }
      .f5 { animation-delay: 1.8s; }
      .f6 { animation-delay: 2.2s; }
      .f7 { animation-delay: 2.6s; }
      .f8 { animation-delay: 3.0s; }
      .f9 { animation-delay: 3.4s; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50%       { opacity: 0.9; }
      }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020812"/>
      <stop offset="50%"  stop-color="#04091a"/>
      <stop offset="100%" stop-color="#020812"/>
    </linearGradient>

    <linearGradient id="pillar_blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d2a4a"/>
      <stop offset="100%" stop-color="#071828"/>
    </linearGradient>
    <linearGradient id="pillar_teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0a2430"/>
      <stop offset="100%" stop-color="#051418"/>
    </linearGradient>
    <linearGradient id="pillar_mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#0d1e38"/>
      <stop offset="100%" stop-color="#060f1e"/>
    </linearGradient>

    <linearGradient id="accent_line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4a9eff" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#4a9eff" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#0ea5a0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0ea5a0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.04">
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#4a9eff"/>
    </pattern>
    <rect width="900" height="280" fill="url(#dots)"/>
  </g>

  <!-- ── ACCENT LINES ── -->
  <rect class="fade f1" x="0" y="56" width="900" height="0.5" fill="url(#accent_line)" opacity="0.3"/>
  <rect class="fade f1" x="0" y="224" width="900" height="0.5" fill="url(#accent_line)" opacity="0.3"/>

  <!-- ── LEFT BLOCK: Title ── -->
  <g class="slide f2">
    <text x="52" y="108"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="11" font-weight="400"
      fill="#4a9eff" letter-spacing="6" opacity="0.7">PORTFOLIO</text>
  </g>

  <g class="slide f3">
    <text x="50" y="158"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="52" font-weight="700"
      fill="#ffffff" letter-spacing="2">GRC</text>
    <text x="168" y="158"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="52" font-weight="300"
      fill="#4a9eff" letter-spacing="1">Projects</text>
  </g>

  <g class="slide f4">
    <text x="52" y="186"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="12" font-weight="300"
      fill="#4a6fa5" letter-spacing="1">Junior Abakar · Cybersécurité GRC</text>
  </g>

  <!-- Vertical separator -->
  <rect class="fade f4" x="390" y="70" width="0.8" height="140" fill="#4a9eff" opacity="0.2"/>

  <!-- ── RIGHT BLOCK: Three pillars ── -->

  <!-- GOUVERNANCE -->
  <g class="slide f5">
    <rect x="420" y="76" width="140" height="120" rx="6" fill="url(#pillar_blue)" stroke="#4a9eff" stroke-width="0.8" opacity="0.9"/>
    <text x="490" y="116"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" font-weight="600"
      fill="#4a9eff" text-anchor="middle" letter-spacing="2">GOUVERNANCE</text>
    <line x1="440" y1="126" x2="540" y2="126" stroke="#4a9eff" stroke-width="0.4" opacity="0.4"/>
    <text x="490" y="144"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#7ab8e8" text-anchor="middle">ISO 27001</text>
    <text x="490" y="159"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#7ab8e8" text-anchor="middle">Audit · SMSI</text>
    <text x="490" y="174"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#4a9eff44" text-anchor="middle">Politiques · Contrôles</text>
  </g>

  <!-- RISQUES -->
  <g class="slide f6">
    <rect x="574" y="76" width="140" height="120" rx="6" fill="url(#pillar_mid)" stroke="#7c8fd0" stroke-width="0.8" opacity="0.9"/>
    <text x="644" y="116"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" font-weight="600"
      fill="#7c8fd0" text-anchor="middle" letter-spacing="2">RISQUES</text>
    <line x1="594" y1="126" x2="694" y2="126" stroke="#7c8fd0" stroke-width="0.4" opacity="0.4"/>
    <text x="644" y="144"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#a0aece" text-anchor="middle">NIST CSF</text>
    <text x="644" y="159"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#a0aece" text-anchor="middle">Risk Assessment</text>
    <text x="644" y="174"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#7c8fd044" text-anchor="middle">FAIR · Quantification</text>
  </g>

  <!-- CONFORMITÉ -->
  <g class="slide f7">
    <rect x="728" y="76" width="140" height="120" rx="6" fill="url(#pillar_teal)" stroke="#0ea5a0" stroke-width="0.8" opacity="0.9"/>
    <text x="798" y="116"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" font-weight="600"
      fill="#0ea5a0" text-anchor="middle" letter-spacing="2">CONFORMITÉ</text>
    <line x1="748" y1="126" x2="848" y2="126" stroke="#0ea5a0" stroke-width="0.4" opacity="0.4"/>
    <text x="798" y="144"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#5dd8d0" text-anchor="middle">RGPD · TPRM</text>
    <text x="798" y="159"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#5dd8d0" text-anchor="middle">Incident Response</text>
    <text x="798" y="174"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#0ea5a044" text-anchor="middle">NIST 800-53 · IAM</text>
  </g>

  <!-- ── BOTTOM BAR ── -->
  <rect class="fade f8" x="0" y="238" width="900" height="42" fill="#020812" opacity="0.7"/>

  <g class="fade f9">
    <text x="52" y="264"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#1e3a5a" letter-spacing="3">ISO 27001  ·  NIST CSF  ·  RGPD  ·  TPRM  ·  INCIDENT RESPONSE</text>

    <text x="848" y="264"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#1e3a5a" text-anchor="end" letter-spacing="2">github.com/juniorabakar</text>
  </g>

  <!-- Corner accent dots -->
  <circle class="fade f2 pulse" cx="52" cy="56" r="3" fill="#4a9eff"/>
  <circle class="fade f2 pulse" cx="848" cy="56" r="3" fill="#0ea5a0"/>

</svg>
