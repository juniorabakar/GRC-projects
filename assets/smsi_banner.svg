<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <style>
      .fade { opacity: 0; animation: fadeIn 0.7s ease forwards; }
      .slide { opacity: 0; animation: slideUp 0.6s ease forwards; }
      .pulse { animation: pulse 2.5s ease-in-out infinite; }
      .blink { animation: blink 1.8s ease-in-out infinite; }

      .f1  { animation-delay: 0.2s; }
      .f2  { animation-delay: 0.5s; }
      .f3  { animation-delay: 0.9s; }
      .f4  { animation-delay: 1.2s; }
      .f5  { animation-delay: 1.5s; }
      .f6  { animation-delay: 1.8s; }
      .f7  { animation-delay: 2.1s; }
      .f8  { animation-delay: 2.4s; }
      .f9  { animation-delay: 2.7s; }
      .f10 { animation-delay: 3.0s; }
      .f11 { animation-delay: 3.3s; }

      @keyframes fadeIn  { to { opacity: 1; } }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50%       { opacity: 1.0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.2; }
      }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#020812"/>
      <stop offset="50%"  stop-color="#04091a"/>
      <stop offset="100%" stop-color="#020812"/>
    </linearGradient>

    <linearGradient id="health_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4a9eff" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#4a9eff" stop-opacity="0.8"/>
      <stop offset="60%"  stop-color="#0ea5a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5a0" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#4a9eff"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#dots)" opacity="0.04"/>

  <!-- Accent lines -->
  <rect class="fade f1" x="0" y="46" width="900" height="0.5" fill="url(#health_grad)" opacity="0.4"/>
  <rect class="fade f1" x="0" y="214" width="900" height="0.5" fill="url(#health_grad)" opacity="0.4"/>

  <!-- LEFT: Medical cross (simple, elegant) -->
  <g class="fade f2" transform="translate(72, 130)">
    <!-- Outer ring pulsing -->
    <circle r="44" fill="none" stroke="#4a9eff" stroke-width="0.6" opacity="0.2" class="pulse"/>
    <circle r="34" fill="#040e1e" stroke="#4a9eff" stroke-width="1.2"/>
    <!-- Cross -->
    <rect x="-5" y="-18" width="10" height="36" rx="2" fill="#4a9eff" opacity="0.9"/>
    <rect x="-18" y="-5" width="36" height="10" rx="2" fill="#4a9eff" opacity="0.9"/>
    <!-- Lock overlay (small, bottom right) -->
    <g transform="translate(18, 18)" stroke="#0ea5a0" stroke-width="1" fill="none">
      <rect x="-7" y="-2" width="14" height="11" rx="2" fill="#04091a" stroke="#0ea5a0"/>
      <path d="M-4 -2 L-4 -6 Q-4 -9 0 -9 Q4 -9 4 -6 L4 -2"/>
      <circle cx="0" cy="3.5" r="1" fill="#0ea5a0"/>
    </g>
  </g>

  <!-- CENTER/RIGHT: Text content -->

  <!-- Eyebrow -->
  <g class="slide f3">
    <text x="148" y="82"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="9" fill="#4a9eff" letter-spacing="5" opacity="0.7">PROJET 01 — GRC-PROJECTS</text>
  </g>

  <!-- Main title -->
  <g class="slide f4">
    <text x="148" y="122"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="38" font-weight="700"
      fill="#ffffff" letter-spacing="1">SMSI</text>
    <text x="260" y="122"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="38" font-weight="300"
      fill="#4a9eff">ISO 27001:2022</text>
  </g>

  <!-- Subtitle -->
  <g class="slide f5">
    <text x="150" y="148"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="13" font-weight="300"
      fill="#4a6fa5" letter-spacing="0.5">Implémentation complète pour MedSecure SAS — HealthTech</text>
  </g>

  <!-- Tags row -->
  <g class="fade f6">
    <!-- Tag 1 -->
    <rect x="148" y="160" width="84" height="20" rx="10" fill="#0a1628" stroke="#4a9eff" stroke-width="0.8"/>
    <text x="190" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="9"
          fill="#4a9eff" text-anchor="middle" letter-spacing="0.5">ISO 27001:2022</text>
  </g>
  <g class="fade f7">
    <rect x="240" y="160" width="68" height="20" rx="10" fill="#0a1628" stroke="#0ea5a0" stroke-width="0.8"/>
    <text x="274" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="9"
          fill="#0ea5a0" text-anchor="middle" letter-spacing="0.5">Données santé</text>
  </g>
  <g class="fade f8">
    <rect x="316" y="160" width="46" height="20" rx="10" fill="#0a1628" stroke="#4a9eff" stroke-width="0.8"/>
    <text x="339" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="9"
          fill="#7ab8e8" text-anchor="middle" letter-spacing="0.5">RGPD</text>
  </g>
  <g class="fade f9">
    <rect x="370" y="160" width="42" height="20" rx="10" fill="#0a1628" stroke="#4a9eff" stroke-width="0.8"/>
    <text x="391" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="9"
          fill="#7ab8e8" text-anchor="middle" letter-spacing="0.5">HDS</text>
  </g>
  <g class="fade f10">
    <rect x="420" y="160" width="50" height="20" rx="10" fill="#0a1628" stroke="#4a9eff" stroke-width="0.8"/>
    <text x="445" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="9"
          fill="#7ab8e8" text-anchor="middle" letter-spacing="0.5">SaaS Cloud</text>
  </g>

  <!-- Right side: Clause progress indicator -->
  <g class="fade f6" transform="translate(720, 72)">
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif"
          font-size="8" fill="#1e3a5a" letter-spacing="3">CLAUSES ISO 27001</text>

    <!-- Clause dots: 4 to 10 -->
    <!-- 4 -->
    <g transform="translate(0, 18)">
      <circle cx="8" cy="8" r="8" fill="#0a1e3d" stroke="#4a9eff" stroke-width="1.2"/>
      <circle cx="8" cy="8" r="3" fill="#4a9eff" class="blink"/>
      <text x="22" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#7ab8e8">Clause 4 — Contexte</text>
    </g>
    <!-- 5 -->
    <g transform="translate(0, 44)">
      <circle cx="8" cy="8" r="8" fill="#0a1224" stroke="#1e3a5a" stroke-width="1"/>
      <circle cx="8" cy="8" r="3" fill="#1e3a5a"/>
      <text x="22" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#2a4a6a">Clause 5 — Leadership</text>
    </g>
    <!-- 6 -->
    <g transform="translate(0, 70)">
      <circle cx="8" cy="8" r="8" fill="#0a1224" stroke="#1e3a5a" stroke-width="1"/>
      <circle cx="8" cy="8" r="3" fill="#1e3a5a"/>
      <text x="22" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#2a4a6a">Clause 6 — Planification</text>
    </g>
    <!-- 7-10 condensed -->
    <g transform="translate(0, 96)">
      <circle cx="8" cy="8" r="8" fill="#0a1224" stroke="#1e3a5a" stroke-width="1"/>
      <circle cx="8" cy="8" r="3" fill="#1e3a5a"/>
      <text x="22" y="12" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#2a4a6a">Clauses 7-10 — Opérations</text>
    </g>
    <!-- Vertical connector line -->
    <line x1="8" y1="34" x2="8" y2="106" stroke="#1e3a5a" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>

  <!-- Bottom bar -->
  <rect class="fade f10" x="0" y="220" width="900" height="40" fill="#020812" opacity="0.8"/>
  <g class="fade f11">
    <text x="52" y="244"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="8" fill="#1e3a5a" letter-spacing="3">SCÉNARIO FICTIF — JUNIOR ABAKAR · GITHUB.COM/JUNIORABAKAR</text>
    <text x="848" y="244"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="8" fill="#1e3a5a" text-anchor="end" letter-spacing="2">ISO 27001:2022 · HDS · RGPD</text>
  </g>

  <!-- Corner accents -->
  <circle class="fade f2 pulse" cx="52" cy="46" r="3" fill="#4a9eff"/>
  <circle class="fade f2 pulse" cx="848" cy="46" r="3" fill="#0ea5a0"/>

</svg>
